apiVersion: v1
kind: Service
metadata:
  name: dataset-api
  labels:
    app.kubernetes.io/name: dataset-api
spec:
  # ClusterIP, not NodePort: inside the cluster this is reached as
  # http://dataset-api.<namespace>.svc.cluster.local:80. Exposure to the
  # outside is the Ingress' job, kept as a separate concern so the same
  # Service works whether you front it with nginx, Istio, or nothing.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dataset-api
  ports:
    - name: http
      port: 80
      targetPort: http
